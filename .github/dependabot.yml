version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-messsage:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      dependency-name: typescript
      update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci